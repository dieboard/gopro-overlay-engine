services:
  # Service 1: The Photon Geocoding API
  photon:
    image: rtuszik/photon-docker:latest
    container_name: photon_geocoder
    environment:
      - REGION=netherlands
      - UPDATE_STRATEGY=DISABLED
    ports:
      - "2322:2322"
    volumes:
      - photon_data:/photon/photon_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2322/api?q=test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10m

  # Service 2: The container that runs your GoPro script
  gopro-script:
    build:
      context: ../
      dockerfile: dockerGeoReverse/Dockerfile
    container_name: gopro_script_runner
    volumes:
      # This now uses a variable for the video folder path
      - ${VIDEO_DIR}:/data
    depends_on:
      photon:
        condition: service_healthy
    # The command now uses variables for the filenames
    command: >
      python3 bin/gopro-to-csv.py
        --gpx
        --reverse-geocode
        --street-state-only
        --reverse-geocode-host photon
        /data/${VIDEO_FILE}
        /data/${OUTPUT_FILE}

# This defines the named volume for persisting Photon's map data
volumes:
  photon_data: